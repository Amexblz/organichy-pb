<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0b5"/>
      <stop offset="100%" stop-color="#e8b896"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle with warm glow -->
  <circle cx="200" cy="200" r="190" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="#f59e0b" stroke-width="4"/>
  
  <!-- Torso & Blazer -->
  <path d="M90 380 C100 290 140 260 200 260 C260 260 300 290 310 380 Z" fill="url(#suit)"/>
  <!-- Shirt collar -->
  <polygon points="200,265 170,305 185,340 200,310 215,340 230,305" fill="#ffffff"/>
  <!-- Amber tie -->
  <polygon points="196,310 204,310 208,370 200,385 192,370" fill="#d97706"/>
  
  <!-- Neck -->
  <rect x="180" y="220" width="40" height="50" rx="10" fill="url(#skin)"/>
  
  <!-- Head & Ears -->
  <circle cx="140" cy="190" r="16" fill="url(#skin)"/>
  <circle cx="260" cy="190" r="16" fill="url(#skin)"/>
  <ellipse cx="200" cy="180" rx="55" ry="65" fill="url(#skin)"/>
  
  <!-- Hair (neat contemporary cut) -->
  <path d="M145 170 C140 120 170 105 200 105 C235 105 260 120 255 170 C248 135 225 125 200 125 C175 125 152 135 145 170 Z" fill="#1c1917"/>
  
  <!-- Eyes -->
  <ellipse cx="180" cy="175" rx="5" ry="4" fill="#1c1917"/>
  <ellipse cx="220" cy="175" rx="5" ry="4" fill="#1c1917"/>
  <circle cx="182" cy="173" r="1.5" fill="#ffffff"/>
  <circle cx="222" cy="173" r="1.5" fill="#ffffff"/>
  
  <!-- Eyebrows -->
  <path d="M170 162 Q180 157 190 163" stroke="#1c1917" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M210 163 Q220 157 230 162" stroke="#1c1917" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Nose -->
  <path d="M200 175 L196 193 L204 193" stroke="#d49b78" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Smile -->
  <path d="M185 210 Q200 222 215 210" stroke="#b45309" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Founder Badge -->
  <g transform="translate(145, 345)">
    <rect x="0" y="0" width="110" height="26" rx="13" fill="#f59e0b" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.2))"/>
    <text x="55" y="17" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#1c1917" text-anchor="middle" letter-spacing="1">FOUNDER</text>
  </g>
</svg>
